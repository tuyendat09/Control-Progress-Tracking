<head><script>(function(){
  function makeStore(){
    var data = {};
    var api = {
      getItem: function(k){ return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
      setItem: function(k, v){ data[k] = String(v); },
      removeItem: function(k){ delete data[k]; },
      clear: function(){ data = {}; },
      key: function(i){ return Object.keys(data)[i] || null; }
    };
    Object.defineProperty(api, 'length', { get: function(){ return Object.keys(data).length; } });
    return api;
  }
  function tryShim(name){
    var works = false;
    try { works = !!window[name] && typeof window[name].getItem === 'function'; void window[name].length; }
    catch (_) { works = false; }
    if (works) return;
    try { Object.defineProperty(window, name, { configurable: true, value: makeStore() }); }
    catch (_) { try { window[name] = makeStore(); } catch (__) {} }
  }
  tryShim('localStorage');
  tryShim('sessionStorage');
})();</script>

  <title>Control</title>
  <style>
    :root {
      --bg:      #161616;
      --card:    #2a2a2c;
      --field:   #1c1c1e;
      --border:  #3a3a3c;
      --muted:   #8e8e93;
      --blue:    #2997ff;
      --ease:    cubic-bezier(0.4, 0, 0.2, 1);
      --fd:      'SF Pro Display', system-ui, -apple-system, sans-serif;
      --fb:      'SF Pro Text', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: #000; height: 100%; }

    body {
      height: 100%;
      font-family: var(--fb);
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      cursor: none;
    }

    /* Custom cursor inherits white on dark via fixed color */
    #cursor-dot, #cursor-ring {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      transition: opacity 0.3s;
    }
    #cursor-dot {
      width: 5px;
      height: 5px;
      background: #fff;
    }
    #cursor-ring {
      width: 36px;
      height: 36px;
      border: 1.5px solid #fff;
      opacity: 0.55;
      mix-blend-mode: difference;
    }

    /* Hide cursor on touch devices to avoid stuck dot */
    @media (hover: none) and (pointer: coarse) {
      #cursor-dot, #cursor-ring { display: none; }
      body { cursor: auto; }
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    /* ─── Landing ───────────────────────────────────────── */
    #sc-land {
      background: #000;
      transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
      overflow: hidden;
    }
    #sc-land.away {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }

    /* Particle sphere — centered square background */
    .sphere-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 0;
      pointer-events: none;
    }
    .sphere-stage canvas {
      display: block;
      width: min(78vw, 78vh, 560px);
      height: min(78vw, 78vh, 560px);
      pointer-events: auto;
      cursor: none;
      /* Subtle radial fade so edges blend into background */
      -webkit-mask-image: radial-gradient(circle at center, #000 60%, rgba(0,0,0,0.6) 80%, transparent 100%);
              mask-image: radial-gradient(circle at center, #000 60%, rgba(0,0,0,0.6) 80%, transparent 100%);
    }

    /* Hero text overlays sphere */
    .hero {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 32px;
      pointer-events: none; /* let sphere capture cursor through hero area */

      font-family: var(--fd);

      letter-spacing: -0.4px;

      display: inline-block;

<script>
/* ───────────────────────────────────────────────────────
   Custom cursor (dot + lagging ring)
   ─────────────────────────────────────────────────────── */
(function(){
  const dot  = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');

  let mx = -200, my = -200;
  let rx = -200, ry = -200;
  const LERP = 0.18;
  let active = false;

  function lerp(a, b, t){ return a + (b - a) * t; }

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    if (!active) { rx = mx; ry = my; active = true; }
    dot.style.left = mx + 'px';
    dot.style.top  = my + 'px';
  });

  document.addEventListener('mouseleave', () => {
    dot.style.opacity = '0';
    ring.style.opacity = '0';
  });
  document.addEventListener('mouseenter', () => {
    dot.style.opacity = '1';
    ring.style.opacity = '0.55';
  });

  function tick() {
    rx = lerp(rx, mx, LERP);
    ry = lerp(ry, my, LERP);
    ring.style.left = rx + 'px';
    ring.style.top  = ry + 'px';
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ───────────────────────────────────────────────────────
   Particle Sphere (canvas, 2200 particles, depth-sorted)
   ─────────────────────────────────────────────────────── */
(function(){
  const canvas = document.getElementById('sphere-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = 560, H = 560;
  canvas.width = W; canvas.height = H;

  const TOTAL = 2200, RADIUS = 170;
  const CX = W/2, CY = H/2;

  let mouseX = -9999, mouseY = -9999;
  let isHovering = false;
  const REPEL_RADIUS = 95, REPEL_FORCE = 5.5;

  const particles = [];

  function randomSpherePoint() {
    const u = Math.random(), v = Math.random();
    const theta = 2 * Math.PI * u;
    const phi = Math.acos(2 * v - 1);
    return {
      ox: Math.sin(phi)*Math.cos(theta),
      oy: Math.sin(phi)*Math.sin(theta),
      oz: Math.cos(phi)
    };
  }

  for (let i = 0; i < TOTAL; i++) {
    const p = randomSpherePoint();
    particles.push({
      ...p,
      vx: 0, vy: 0,
      size: Math.random()*1.4 + 0.4,
      brightness: Math.random()*0.5 + 0.5
    });
  }

  let angle = 0;

  function project(x, y, z) {
    const fov = 420, scale = fov / (fov + z * RADIUS);
    return { sx: CX + x*RADIUS*scale, sy: CY + y*RADIUS*scale, scale };
  }
  function rotateY(x, y, z, a) {
    const cos = Math.cos(a), sin = Math.sin(a);
    return { rx: x*cos + z*sin, ry: y, rz: -x*sin + z*cos };
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    angle += 0.0045;

    const sorted = particles.map(p => {
      const r = rotateY(p.ox, p.oy, p.oz, angle);
      let px = CX + r.rx * RADIUS;
      let py = CY + r.ry * RADIUS;
      let vx = p.vx, vy = p.vy;

      if (isHovering) {
        const dx = px - mouseX, dy = py - mouseY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < REPEL_RADIUS && dist > 0.1) {
          const force = (1 - dist/REPEL_RADIUS) * REPEL_FORCE;
          vx += (dx/dist)*force;
          vy += (dy/dist)*force;
        }
      }
      vx *= 0.85; vy *= 0.85;
      p.vx = vx; p.vy = vy;
      px += vx; py += vy;

      const proj = project(r.rx, r.ry, r.rz);
      const depth = (r.rz + 1) / 2;
      return { px, py, depth, size: p.size, brightness: p.brightness, proj };
    });

    sorted.sort((a, b) => a.depth - b.depth);

    // Always render in dark-mode palette since the page is dark themed
    for (const p of sorted) {
      const alpha = (0.3 + p.depth*0.7) * p.brightness;
      const size = p.size * (0.5 + p.depth*0.8) * p.proj.scale;
      ctx.fillStyle = `rgba(180,200,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(p.px, p.py, Math.max(0.3, size), 0, Math.PI*2);
      ctx.fill();
    }

    requestAnimationFrame(render);
  }

  function mapPointer(e) {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
    mouseY = (e.clientY - rect.top)  * (H / rect.height);
    isHovering = true;
  }

  canvas.addEventListener('mousemove', mapPointer);
  canvas.addEventListener('mouseleave', () => {
    isHovering = false;
    mouseX = -9999; mouseY = -9999;
  });
  // Touch support
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length) mapPointer(e.touches[0]);
  }, { passive: true });
  canvas.addEventListener('touchend', () => {
    isHovering = false;
    mouseX = -9999; mouseY = -9999;
  });

  render();
})();

/* ───────────────────────────────────────────────────────
   Typewriter hero
   ─────────────────────────────────────────────────────── */
const PHRASES = ["Let's workout", "Earn your goal"];
let pIdx = 0, cIdx = 0, deleting = false;
const typedEl = document.getElementById('typed');

(function tick() {
  const word = PHRASES[pIdx];
  if (!deleting) {
    typedEl.textContent = word.slice(0, ++cIdx);
    if (cIdx === word.length) { deleting = true; return setTimeout(tick, 1900); }
    setTimeout(tick, 65);
  } else {
    typedEl.textContent = word.slice(0, --cIdx);
    if (!cIdx) { deleting = false; pIdx = (pIdx + 1) % PHRASES.length; return setTimeout(tick, 450); }
    setTimeout(tick, 38);
  }
})();

/* ───────────────────────────────────────────────────────
   Auth flow (landing → slide-up auth → email → password)
   ─────────────────────────────────────────────────────── */
const land   = document.getElementById('sc-land');
const authSc = document.getElementById('sc-auth');
let authMode = 'login';

function openAuth(mode) {
  authMode = mode;
  resetAuth();
  document.getElementById('auth-h1').textContent  = mode === 'signup' ? 'Create account' : 'Log in';
  document.getElementById('auth-desc').textContent = mode === 'signup' ? 'Start your streak today.' : 'Track calories. Build streaks.';
  land.classList.add('away');
  authSc.classList.add('open');
}

function closeAuth() {
  authSc.classList.remove('open');
  setTimeout(() => land.classList.remove('away'), 60);
  setTimeout(resetAuth, 440);
}

document.getElementById('land-login').addEventListener('click',  () => openAuth('login'));
document.getElementById('land-signup').addEventListener('click', () => openAuth('signup'));

let step = 'email';
const emailFF   = document.getElementById('email-ff');
const emailIn   = document.getElementById('email-in');
const frozenEl  = document.getElementById('frozen');
const frozenVal = document.getElementById('frozen-val');
const pwWrapEl  = document.getElementById('pw-wrap');
const socialEl  = document.getElementById('social');
const authH1El  = document.getElementById('auth-h1');

document.getElementById('back-btn').addEventListener('click', () => {
  if (step === 'password') backToEmail(); else closeAuth();
});

document.getElementById('continue-btn').addEventListener('click', () => {
  if (step === 'email') {
    const v = emailIn.value.trim();
    if (!v.includes('@')) { emailIn.focus(); return; }
    goPassword(v);
  }
});

function goPassword(email) {
  step = 'password';
  frozenVal.textContent = email;
  emailFF.style.display = 'none';
  frozenEl.style.display = 'block';
  socialEl.classList.add('off');
  authH1El.textContent = authMode === 'signup' ? 'Create a password' : 'Enter password';
  requestAnimationFrame(() => {
    pwWrapEl.classList.add('on');
    setTimeout(() => document.getElementById('pw-in').focus(), 220);
  });
}

function backToEmail() {
  step = 'email';
  authH1El.textContent = authMode === 'signup' ? 'Create account' : 'Log in';
  frozenEl.style.display = 'none';
  emailFF.style.display = '';
  pwWrapEl.classList.remove('on');
  socialEl.classList.remove('off');
}

function resetAuth() {
  step = 'email';
  emailIn.value = '';
  document.getElementById('pw-in').value = '';
  frozenEl.style.display = 'none';
  emailFF.style.display = '';
  pwWrapEl.classList.remove('on');
  socialEl.classList.remove('off');
  updateFF(emailIn);
  updateFF(document.getElementById('pw-in'));
}

document.getElementById('edit-email').addEventListener('click', backToEmail);

function updateFF(inp) {
  const ff = inp.closest('.ff');
  if (!ff) return;
  const hasVal  = inp.value.length > 0;
  const focused = document.activeElement === inp;
  ff.classList.toggle('active',  hasVal || focused);
  ff.classList.toggle('blurred', hasVal && !focused);
}

[emailIn, document.getElementById('pw-in')].forEach(inp =>
  ['input', 'focus', 'blur'].forEach(ev => inp.addEventListener(ev, () => updateFF(inp)))
);

document.getElementById('pw-toggle').addEventListener('click', () => {
  const inp = document.getElementById('pw-in');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  document.getElementById('pw-toggle').textContent = show ? 'Hide' : 'Show';
});
</script>
</body>
