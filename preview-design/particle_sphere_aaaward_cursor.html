
<div style="display:flex;justify-content:center;align-items:center;width:100%;height:520px;background:transparent;position:relative;">
  <canvas id="c" width="520" height="520" style="display:block;cursor:none;"></canvas>
</div>

<style>
#cursor-dot, #cursor-ring { position:fixed; pointer-events:none; z-index:99999; transform:translate(-50%,-50%); border-radius:50%; transition:opacity .3s; }
#cursor-dot { width:5px; height:5px; background:var(--color-text-primary); }
#cursor-ring { width:36px; height:36px; border:1.5px solid var(--color-text-primary); opacity:.55; mix-blend-mode:difference; }
</style>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<script>
(function(){

/* ---------- CURSOR ---------- */
const dot  = document.getElementById('cursor-dot');
const ring = document.getElementById('cursor-ring');

let mx = -200, my = -200;
let rx = -200, ry = -200;
const LERP = 0.1;

function lerp(a, b, t){ return a + (b - a) * t; }

let cursorActive = false;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  if (!cursorActive) { rx = mx; ry = my; cursorActive = true; }
  dot.style.left = mx + 'px';
  dot.style.top  = my + 'px';
});

function tickCursor() {
  rx = lerp(rx, mx, LERP);
  ry = lerp(ry, my, LERP);
  ring.style.left = rx + 'px';
  ring.style.top  = ry + 'px';
  requestAnimationFrame(tickCursor);
}
tickCursor();

/* ---------- SPHERE ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 520, H = 520;
canvas.width = W; canvas.height = H;

const TOTAL = 2200, RADIUS = 160;
const CX = W/2, CY = H/2;

let mouseX = -9999, mouseY = -9999;
let isHovering = false;
const REPEL_RADIUS = 90, REPEL_FORCE = 5.5;

const particles = [];

function randomSpherePoint() {
  const u = Math.random(), v = Math.random();
  const theta = 2 * Math.PI * u;
  const phi = Math.acos(2 * v - 1);
  return { ox: Math.sin(phi)*Math.cos(theta), oy: Math.sin(phi)*Math.sin(theta), oz: Math.cos(phi) };
}

for (let i = 0; i < TOTAL; i++) {
  const p = randomSpherePoint();
  particles.push({ ...p, vx:0, vy:0, size: Math.random()*1.4+0.4, brightness: Math.random()*0.5+0.5 });
}

let angle = 0;

function project(x, y, z) {
  const fov = 420, scale = fov / (fov + z * RADIUS);
  return { sx: CX + x*RADIUS*scale, sy: CY + y*RADIUS*scale, scale };
}
function rotateY(x, y, z, a) {
  const cos = Math.cos(a), sin = Math.sin(a);
  return { rx: x*cos + z*sin, ry: y, rz: -x*sin + z*cos };
}

function render() {
  ctx.clearRect(0, 0, W, H);
  angle += 0.0045;

  const sorted = particles.map(p => {
    const r = rotateY(p.ox, p.oy, p.oz, angle);
    let px = CX + r.rx * RADIUS;
    let py = CY + r.ry * RADIUS;
    let vx = p.vx, vy = p.vy;

    if (isHovering) {
      const dx = px - mouseX, dy = py - mouseY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < REPEL_RADIUS && dist > 0.1) {
        const force = (1 - dist/REPEL_RADIUS) * REPEL_FORCE;
        vx += (dx/dist)*force; vy += (dy/dist)*force;
      }
    }
    vx *= 0.85; vy *= 0.85;
    p.vx = vx; p.vy = vy;
    px += vx; py += vy;

    const proj = project(r.rx, r.ry, r.rz);
    const depth = (r.rz + 1) / 2;
    return { px, py, depth, size: p.size, brightness: p.brightness, proj };
  });

  sorted.sort((a, b) => a.depth - b.depth);

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  for (const p of sorted) {
    const alpha = (0.3 + p.depth*0.7) * p.brightness;
    const size = p.size * (0.5 + p.depth*0.8) * p.proj.scale;
    if (isDark) {
      ctx.fillStyle = `rgba(180,200,255,${alpha})`;
    } else {
      const r = Math.round(80 + p.depth*80), g = Math.round(100 + p.depth*80), b = Math.round(200 + p.depth*55);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    }
    ctx.beginPath();
    ctx.arc(p.px, p.py, Math.max(0.3, size), 0, Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(render);
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  mouseY = (e.clientY - rect.top)  * (H / rect.height);
  isHovering = true;
});
canvas.addEventListener('mouseleave', () => { isHovering = false; mouseX = -9999; mouseY = -9999; });

render();
})();
</script>
